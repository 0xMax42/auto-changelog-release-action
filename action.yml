name: Auto Changelog & Release
description: "One-stop composite action for version-bump detection, changelog generation, and host-aware Gitea or GitHub releases."

inputs:
  token:
    description: "Explicit Gitea or GitHub token for release publication."
    required: false
    default: ""
  author_name:
    description: "Commit-Autorname"
    required: false
    default: ""
  author_email:
    description: "Commit-Autore-Mail"
    required: false
    default: ""
  allow_non_main_release:
    description: "Allow publishing releases from branches other than 'main'."
    required: false
    default: "false"
  version_file:
    description: "File that contains the project version (Single Source of Truth)."
    required: false
    default: "VERSION"

  version_regex:
    description: >
      Regular expression used to extract the version from version_file.
      If empty, a sensible default is chosen based on the file name.
    required: false
    default: "^(.*)$"

  github_sha_override:
    description: >
      Override for the GitHub SHA used to determine the commit range for version bump detection.
      Useful for testing or non-standard workflows. If empty, the triggering commit SHA is used.
    required: false
    default: ""

  major_patterns:
    description: >
      New-line-separated list of regex patterns to identify major version bumps from commit messages.
      If empty, no major version bumps will be detected.
    required: false
    default: ""
  minor_patterns:
    description: >
      New-line-separated list of regex patterns to identify minor version bumps from commit messages.
      If empty, no minor version bumps will be detected.
    required: false
    default: ""
  patch_patterns:
    description: >
      New-line-separated list of regex patterns to identify patch version bumps from commit messages.
      If empty, no patch version bumps will be detected.
    required: false
    default: ""
  git_cliff_offline:
    description: "Run git-cliff without fetching remote metadata."
    required: false
    default: "true"
  commit_unreleased_changelog:
    description: "Commit and push the generated unreleased changelog on non-release runs."
    required: false
    default: "false"

  trigger_release_workflows:
    description: >
      Allow the published release to trigger release workflows.
      Currently effective on Gitea hosts supporting the trigger_workflows release API option.
    required: false
    default: "false"

outputs:
  release_created:
    description: "Whether this run created a remote release."
    value: ${{ steps.run_action_pipeline.outputs.release_created }}
  release_prerelease:
    description: "Whether the release for this run was marked as a prerelease."
    value: ${{ steps.run_action_pipeline.outputs.release_prerelease }}
  release_tag:
    description: "The release tag derived from the resolved version."
    value: ${{ steps.run_action_pipeline.outputs.release_tag }}

runs:
  using: "composite"
  steps:
    - name: Install Python
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/install-python.sh

    - name: Run action pipeline
      id: run_action_pipeline
      shell: bash
      env:
        GITHUB_OUTPUT: ${{ github.output }}
        GITHUB_ENV: ${{ github.env }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        AUTHOR_NAME: ${{ inputs.author_name }}
        AUTHOR_EMAIL: ${{ inputs.author_email }}
        ALLOW_NON_MAIN_RELEASE: ${{ inputs.allow_non_main_release }}
        VERSION_FILE: ${{ inputs.version_file }}
        VERSION_REGEX: ${{ inputs.version_regex }}
        MAJOR_PATTERNS: ${{ inputs.major_patterns }}
        MINOR_PATTERNS: ${{ inputs.minor_patterns }}
        PATCH_PATTERNS: ${{ inputs.patch_patterns }}
        GIT_CLIFF_OFFLINE: ${{ inputs.git_cliff_offline }}
        COMMIT_UNRELEASED_CHANGELOG: ${{ inputs.commit_unreleased_changelog }}
        RANGE: ${{ github.event.before }}..${{ inputs.github_sha_override || github.sha || '' }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
        GITHUB_SHA: ${{ inputs.github_sha_override || github.sha || '' }}
        GITHUB_REF: ${{ github.ref || '' }}
        GITHUB_API_URL: ${{ github.api_url || '' }}
        GITHUB_SERVER_URL: ${{ github.server_url || '' }}
        GITHUB_REPOSITORY: ${{ github.repository || '' }}
        RELEASE_PUBLISH_TOKEN: ${{ inputs.token || '' }}
        TRIGGER_RELEASE_WORKFLOWS: ${{ inputs.trigger_release_workflows }}
      run: |
        PYTHONPATH="${{ github.action_path }}/src${PYTHONPATH:+:${PYTHONPATH}}" \
          python3 -m auto_changelog_release_action

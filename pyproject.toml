[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "auto-changelog-release-action"
version = "1.18.0"
description = "Internal Python package for the auto changelog release action"
authors = [
    "auto-changelog-release-action maintainers <maintainers@example.invalid>",
]
readme = "CHANGELOG.md"
packages = [{ include = "auto_changelog_release_action", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
ruff = "0.16.10"
mypy = "2.4.0"
taskipy = "1.14.1"

[tool.taskipy.tasks]
ensure-git-cliff = { cmd = "python scripts/ensure_git_cliff.py", help = "Cache the official git-cliff binary for integration tests." }
pre_test = "task ensure-git-cliff"
pre_test-integration = "task ensure-git-cliff"
pre_goldens-check = "task ensure-git-cliff"
pre_goldens-update = "task ensure-git-cliff"
test = { cmd = "pytest tests/unit tests/integration", help = "Run unit and integration tests." }
test-unit = { cmd = "pytest tests/unit", help = "Run unit tests." }
test-integration = { cmd = "pytest tests/integration", help = "Run integration tests." }
goldens-check = { cmd = "pytest tests/integration/test_git_cliff_templates.py", help = "Check git-cliff golden files." }
goldens-update = { cmd = "UPDATE_GIT_CLIFF_GOLDENS=1 pytest tests/integration/test_git_cliff_templates.py", help = "Regenerate git-cliff golden files." }
test-podman = { cmd = "RUN_PODMAN_TESTS=1 pytest tests/podman -m podman", help = "Run Podman smoke tests." }
compile = { cmd = "python -m compileall -q scripts src tests", help = "Check Python syntax." }
lint = { cmd = "ruff check scripts src tests", help = "Lint the Python sources." }
format-check = { cmd = "ruff format --check scripts src tests", help = "Check Python formatting." }
typecheck = { cmd = "mypy src tests", help = "Run static type checks." }

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: tests that exercise local git repositories",
    "podman: tests that run installer flows inside Podman containers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

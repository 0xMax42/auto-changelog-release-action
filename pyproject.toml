[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "auto-changelog-release-action"
version = "1.16.1"
description = "Internal Python package for the auto changelog release action"
authors = [
    "auto-changelog-release-action maintainers <maintainers@example.invalid>",
]
readme = "CHANGELOG.md"
packages = [{ include = "auto_changelog_release_action", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
ruff = "0.16.5"
mypy = "2.3.1"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: tests that exercise local git repositories",
    "podman: tests that run installer flows inside Podman containers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
